version: "3.8"

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: baseplate_pg
    environment:
      POSTGRES_USER: saas_admin
      POSTGRES_PASSWORD: SuperSecretPassword123!
      POSTGRES_DB: BasePlateDb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data:
